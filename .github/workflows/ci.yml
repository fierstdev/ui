name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build Registry, Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: true

      - name: Rebuild & Verify Static Registry Manifests
        run: |
          npm run build:registry
          npm run build:docs -- --check
          git diff --exit-code -- public/r

      - name: Format, Lint & Type Check
        run: vp check

      - name: Registry & CLI Tests
        run: vp test

      - name: Build Showcase
        run: vp build

      - name: Browser accessibility and keyboard checks
        run: |
          npm exec --offline -- playwright install --with-deps chromium
          npm run test:browser
